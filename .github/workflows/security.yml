name: Security Scan

on:
  push:
    branches: [master, develop]
  pull_request:
    branches: [master, develop]
  schedule:
    - cron: '0 0 * * 0'

permissions:
  contents: read

jobs:
  scan:
    name: Bandit and Dependency Audit
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Sync Python environment
        run: uv sync --frozen

      - name: Run Bandit
        run: uvx bandit -r app/ -f json -o bandit-report.json
        continue-on-error: true

      - name: Run pip-audit
        run: uvx pip-audit -r requirements.txt -f json -o pip-audit-report.json
        continue-on-error: true

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: security-reports
          path: |
            bandit-report.json
            pip-audit-report.json
