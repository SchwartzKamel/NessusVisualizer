# NessusVisualizer Docker Compose Configuration
# Multi-service orchestration for the application

services:
  # Redis service for session management
  redis:
    image: redis:7-alpine
    container_name: nessus_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - nessus_network

  # Main NessusVisualizer application
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: nessus_visualizer
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      - FLASK_APP=wsgi.py
      - FLASK_ENV=production
      - SECRET_KEY=${SECRET_KEY:-change-me-in-production}
      - PROD_DATABASE_URI=${PROD_DATABASE_URI:-sqlite:////app/nessus_visualizer.db}
      - SESSION_TYPE=redis
      - REDIS_URI=redis://redis:6379
      - NESSUS_URL=${NESSUS_URL}
      - NESSUS_USER=${NESSUS_USER}
      - NESSUS_PASS=${NESSUS_PASS}
    volumes:
      - app_data:/app/data
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/login"]
      interval: 30s
      timeout: 10s
      start_period: 10s
      retries: 3
    networks:
      - nessus_network

volumes:
  redis_data:
    driver: local
  app_data:
    driver: local

networks:
  nessus_network:
    driver: bridge
