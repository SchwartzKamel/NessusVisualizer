[project]
name = "NessusVisualizer"
version = "0.2.0"
description = "Web application to visualize Nessus scan results"
authors = [
    {name = "SchwartzKamel", email = "lafiamafia@protonmail.com"}
]
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.12"
classifiers = [
    "Development Status :: 4 - Beta",
    "Framework :: Flask",
    "Intended Audience :: Information Technology",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Topic :: Security",
]

dependencies = [
    "cachelib>=0.9.0",
    "certifi>=2024.7.4",
    "click>=8.1.7",
    "dnspython>=2.6.1",
    "email-validator>=2.1.0",
    "Flask>=3.0.0",
    "Flask-Login>=0.6.3",
    "Flask-Session>=0.5.0",
    "Flask-SQLAlchemy>=3.1.1",
    "Flask-WTF>=1.2.1",
    "gunicorn>=21.2.0",
    "itsdangerous>=2.1.2",
    "Jinja2>=3.1.6",
    "MarkupSafe>=2.1.5",
    "numpy>=1.26.0",
    "pandas>=2.1.0",
    "python-dateutil>=2.8.2",
    "python-dotenv>=1.0.0",
    "pytz>=2024.1",
    "redis>=5.0.0",
    "requests>=2.32.4",
    "SQLAlchemy>=2.0.0",
    "urllib3>=2.6.0",
    "Werkzeug>=3.0.0",
    "WTForms>=3.1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=4.1.0",
    "pytest-flask>=1.3.0",
    "ruff>=0.1.0",
    "mypy>=1.8.0",
    "safety>=2.3.0",
]

[project.urls]
Homepage = "https://github.com/SchwartzKamel/NessusVisualizer"
Repository = "https://github.com/SchwartzKamel/NessusVisualizer"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
addopts = "-v --tb=short"

[tool.ruff]
target-version = "py312"
line-length = 100
select = ["E", "F", "W", "I", "N", "B", "C4", "UP"]
ignore = ["E501"]

[tool.ruff.per-file-ignores]
"tests/*" = ["S101"]

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true

[tool.coverage.run]
source = ["app"]
omit = ["tests/*"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise NotImplementedError",
]
